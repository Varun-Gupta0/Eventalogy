<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<title>Event Requirements - Eventology India</title>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style type="text/tailwindcss">
      :root {
        --primary-yellow: #FFC500;
        --bg-black: #07070A;
        --input-bg: #1A1A1E;
        --text-secondary: #9CA3AF;
      }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

  </head>
<body class="bg-[var(--bg-black)] text-white font-['Space_Grotesk'] antialiased">
<div class="relative flex size-full min-h-screen flex-col justify-between group/design-root overflow-x-hidden">
<div class="flex-1 pb-24">
<div class="flex items-center p-4 pt-6 justify-between">
<div class="text-white flex size-10 shrink-0 items-center justify-center rounded-full hover:bg-white/10 transition-colors cursor-pointer">
<span class="material-symbols-outlined">arrow_back</span>
</div>
<h2 class="text-white text-xl font-bold leading-tight tracking-tight flex-1 text-center pr-10">Event Requirements</h2>
</div>
<div class="px-6 py-6">
<div class="flex items-center justify-between relative">
<div class="absolute left-0 top-1/2 -translate-y-1/2 w-full h-[2px] bg-[#2A2A2E] -z-10"></div>
<div class="flex flex-col items-center gap-2">
<div class="size-8 rounded-full bg-[var(--primary-yellow)] flex items-center justify-center text-[var(--bg-black)] font-bold text-sm shadow-[0_0_10px_rgba(255,197,0,0.4)]">1</div>
</div>
<div class="absolute left-0 top-1/2 -translate-y-1/2 w-[10%] h-[2px] bg-[var(--primary-yellow)] -z-10"></div>
<div class="flex flex-col items-center gap-2">
<div class="size-8 rounded-full bg-[#2A2A2E] border-2 border-[#2A2A2E] flex items-center justify-center text-gray-500 font-medium text-sm">2</div>
</div>
<div class="flex flex-col items-center gap-2">
<div class="size-8 rounded-full bg-[#2A2A2E] border-2 border-[#2A2A2E] flex items-center justify-center text-gray-500 font-medium text-sm">3</div>
</div>
<div class="flex flex-col items-center gap-2">
<div class="size-8 rounded-full bg-[#2A2A2E] border-2 border-[#2A2A2E] flex items-center justify-center text-gray-500 font-medium text-sm">4</div>
</div>
<div class="flex flex-col items-center gap-2">
<div class="size-8 rounded-full bg-[#2A2A2E] border-2 border-[#2A2A2E] flex items-center justify-center text-gray-500 font-medium text-sm">5</div>
</div>
</div>
<div class="flex justify-between mt-2 px-1">
<span class="text-[var(--primary-yellow)] text-xs font-medium">Details</span>
<span class="text-gray-600 text-xs font-medium">Date</span>
<span class="text-gray-600 text-xs font-medium">Guest</span>
<span class="text-gray-600 text-xs font-medium">Theme</span>
<span class="text-gray-600 text-xs font-medium">Review</span>
</div>
</div>
<div class="px-5 space-y-8 mt-4">
<div class="space-y-3">
<div class="flex items-center gap-2">
<h3 class="text-white text-base font-bold tracking-wide">Event Description</h3>
<span class="material-symbols-outlined text-[var(--text-secondary)] text-[18px] cursor-help opacity-70 hover:opacity-100">info</span>
</div>
<div class="group relative rounded-2xl bg-[var(--input-bg)] p-1 transition-all focus-within:ring-2 focus-within:ring-[var(--primary-yellow)] focus-within:ring-opacity-50">
<textarea class="block w-full resize-none bg-transparent border-0 text-white placeholder-[var(--text-secondary)] focus:ring-0 text-base leading-relaxed p-4 min-h-[140px]" placeholder="Describe your vision for the event (e.g., A magical starlit wedding dinner for 200 guests...)"></textarea>
</div>
</div>
<div class="space-y-3">
<div class="flex items-center gap-2">
<h3 class="text-white text-base font-bold tracking-wide">Reference (Optional)</h3>
<span class="material-symbols-outlined text-[var(--text-secondary)] text-[18px] cursor-help opacity-70 hover:opacity-100">info</span>
</div>
<div class="group relative flex items-center rounded-xl bg-[var(--input-bg)] transition-all focus-within:ring-2 focus-within:ring-[var(--primary-yellow)] focus-within:ring-opacity-50 h-14">
<input class="flex-1 bg-transparent border-0 text-white placeholder-[var(--text-secondary)] focus:ring-0 text-base px-4 h-full" placeholder="Paste image or venue URL" type="text"/>
<div class="pr-4 text-[var(--text-secondary)]">
<span class="material-symbols-outlined">link</span>
</div>
</div>
</div>
<div class="space-y-3">
<div class="flex items-center gap-2">
<h3 class="text-white text-base font-bold tracking-wide">Event Location</h3>
<span class="material-symbols-outlined text-[var(--text-secondary)] text-[18px] cursor-help opacity-70 hover:opacity-100">info</span>
</div>
<div class="relative w-full aspect-[16/9] rounded-2xl overflow-hidden group cursor-pointer border border-[#2A2A2E] hover:border-[var(--primary-yellow)] transition-colors">
<div class="absolute inset-0 bg-center bg-cover bg-no-repeat opacity-60 group-hover:opacity-40 transition-opacity" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuDY9n0eFAzUhtmEUX-MCV9-daJiwPmJ9ccsM2cZtbW1uvQ6TEiPEF0PlRWrjeyarZg_5K17QQvey9z-seUXXAdEEr1DGnUc4aqlPaNbqU2s1DpE9VrmxRQ8YUDZf9tQT9cWm_LY_A3YJNS0rxwleXy6U_Jw_0BPCuqV9m0KoswqRtR5ZIzLX4zN3zTqIOz1W-RvtXQG58Zmqxywmj8Uf3fVd5O0-jVmSORT1JQE_06lba6VduzkXY9eN8YfqB8RBs-NXq-1TXeEDA");'></div>
<div class="absolute inset-0 flex flex-col items-center justify-center">
<div class="bg-[var(--bg-black)]/80 backdrop-blur-sm p-3 rounded-full border border-[var(--primary-yellow)] shadow-lg animate-bounce">
<span class="material-symbols-outlined text-[var(--primary-yellow)] text-2xl">location_on</span>
</div>
<span class="mt-3 bg-black/50 backdrop-blur-md text-white px-4 py-1.5 rounded-full text-sm font-medium border border-white/10">Select Location on Map</span>
</div>
</div>
</div>
</div>
</div>
<div class="bg-[var(--bg-black)] border-t border-[#1A1A1E]">
<div class="px-5 py-4">
<button class="flex w-full cursor-pointer items-center justify-center rounded-xl h-14 bg-[var(--primary-yellow)] text-[var(--bg-black)] text-lg font-bold tracking-wide hover:bg-[#E6B200] transition-colors shadow-[0_4px_20px_rgba(255,197,0,0.15)]">
<span>Next Step</span>
<span class="material-symbols-outlined ml-2 text-[20px] font-bold">arrow_forward</span>
</button>
</div>
<div class="flex justify-around items-center px-2 pb-6 pt-2">
<a class="flex flex-col items-center gap-1.5 p-2 rounded-xl text-white group" href="#">
<span class="material-symbols-outlined group-hover:text-[var(--primary-yellow)] transition-colors filled">home</span>
<span class="text-[10px] font-medium tracking-wide group-hover:text-[var(--primary-yellow)] transition-colors">Home</span>
</a>
<a class="flex flex-col items-center gap-1.5 p-2 rounded-xl text-[var(--text-secondary)] group hover:text-white transition-colors" href="#">
<span class="material-symbols-outlined group-hover:text-[var(--primary-yellow)] transition-colors">calendar_month</span>
<span class="text-[10px] font-medium tracking-wide group-hover:text-[var(--primary-yellow)] transition-colors">Events</span>
</a>
<a class="flex flex-col items-center gap-1.5 p-2 rounded-xl text-[var(--primary-yellow)] group" href="#">
<div class="bg-[var(--primary-yellow)]/10 p-1.5 px-4 rounded-full">
<span class="material-symbols-outlined text-[var(--primary-yellow)]">add_circle</span>
</div>
<span class="text-[10px] font-medium tracking-wide text-[var(--primary-yellow)]">Create</span>
</a>
<a class="flex flex-col items-center gap-1.5 p-2 rounded-xl text-[var(--text-secondary)] group hover:text-white transition-colors" href="#">
<span class="material-symbols-outlined group-hover:text-[var(--primary-yellow)] transition-colors">chat_bubble</span>
<span class="text-[10px] font-medium tracking-wide group-hover:text-[var(--primary-yellow)] transition-colors">Chat</span>
</a>
<a class="flex flex-col items-center gap-1.5 p-2 rounded-xl text-[var(--text-secondary)] group hover:text-white transition-colors" href="#">
<span class="material-symbols-outlined group-hover:text-[var(--primary-yellow)] transition-colors">person</span>
<span class="text-[10px] font-medium tracking-wide group-hover:text-[var(--primary-yellow)] transition-colors">Profile</span>
</a>
</div>
</div>
</div>
