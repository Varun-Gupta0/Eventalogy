<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Vendor Registration Step 1/3</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Noto+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#FFC500",
                        "background-dark": "#07070A",
                        "surface-dark": "#121214",
                        "surface-highlight": "#1C1C1E",
                        "text-secondary": "#A1A1AA",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "Noto Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "2xl": "2rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        body {
            font-family: "Space Grotesk", "Noto Sans", sans-serif;
            -webkit-tap-highlight-color: transparent;
            background-color: #07070A;
        }
        .step-active {
            @apply w-12 h-1 bg-primary rounded-full transition-all duration-300;
        }
        .step-inactive {
            @apply w-8 h-1 bg-white/10 rounded-full transition-all duration-300;
        }
        input:focus, select:focus {
            outline: none !important;
            box-shadow: none !important;
            border-color: #FFC500 !important;
        }
        .switch-toggle:checked ~ .switch-dot {
            transform: translateX(100%);
            background-color: #FFC500;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-white min-h-screen flex flex-col p-6">
<header class="mb-8">
<div class="flex items-center justify-between mb-8">
<button class="size-10 flex items-center justify-center rounded-full bg-white/5 border border-white/10">
<span class="material-symbols-outlined text-white">arrow_back_ios_new</span>
</button>
<div class="flex gap-2">
<div class="step-active"></div>
<div class="step-inactive"></div>
<div class="step-inactive"></div>
</div>
<div class="size-10"></div>
</div>
<h1 class="text-3xl font-bold tracking-tight">Vendor Registration</h1>
<p class="text-text-secondary mt-2">Step 1: Personal &amp; Company Details</p>
</header>
<div class="flex flex-col gap-6">
<div class="space-y-4">
<div class="space-y-1.5">
<label class="text-xs font-bold uppercase tracking-wider text-text-secondary ml-1">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-text-secondary text-xl">person</span>
<input class="w-full bg-surface-dark border-white/5 rounded-2xl py-4 pl-12 text-white placeholder:text-neutral-600 focus:ring-0" placeholder="John Doe" type="text"/>
</div>
</div>
<div class="space-y-1.5">
<label class="text-xs font-bold uppercase tracking-wider text-text-secondary ml-1">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-text-secondary text-xl">mail</span>
<input class="w-full bg-surface-dark border-white/5 rounded-2xl py-4 pl-12 text-white placeholder:text-neutral-600 focus:ring-0" placeholder="john@example.com" type="email"/>
</div>
</div>
</div>
<div class="bg-surface-dark p-5 rounded-2xl border border-white/5 flex items-center justify-between">
<div>
<h3 class="font-bold text-sm">Entity Type</h3>
<p class="text-xs text-text-secondary">Register as Individual or Company</p>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input class="sr-only peer switch-toggle" id="entityToggle" type="checkbox"/>
<div class="w-14 h-7 bg-white/10 rounded-full peer-checked:bg-primary/20 transition-colors"></div>
<div class="switch-dot absolute left-1 top-1 bg-white/40 w-5 h-5 rounded-full transition-transform duration-200"></div>
</label>
</div>
<div class="space-y-4" id="companyFields">
<div class="space-y-1.5">
<label class="text-xs font-bold uppercase tracking-wider text-text-secondary ml-1">CIN (Corporate ID)</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-text-secondary text-xl">corporate_fare</span>
<input class="w-full bg-surface-dark border-white/5 rounded-2xl py-4 pl-12 text-white placeholder:text-neutral-600 focus:ring-0" placeholder="U12345DL2023PTC123456" type="text"/>
</div>
</div>
<div class="space-y-1.5">
<label class="text-xs font-bold uppercase tracking-wider text-text-secondary ml-1">PAN Card Number</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-text-secondary text-xl">badge</span>
<input class="w-full bg-surface-dark border-white/5 rounded-2xl py-4 pl-12 text-white placeholder:text-neutral-600 focus:ring-0 uppercase" placeholder="ABCDE1234F" type="text"/>
</div>
</div>
</div>
<div class="space-y-4">
<h3 class="text-xs font-bold uppercase tracking-wider text-primary ml-1">Contact Trio (3 Mandatory)</h3>
<div class="space-y-3">
<div class="flex gap-2">
<div class="w-24 shrink-0 bg-surface-dark border border-white/5 rounded-2xl flex items-center px-3">
<span class="text-xs font-bold text-text-secondary mr-1">🇮🇳</span>
<select class="bg-transparent border-none text-sm p-0 focus:ring-0 w-full">
<option>+91</option>
<option>+1</option>
<option>+44</option>
</select>
</div>
<input class="flex-1 bg-surface-dark border-white/5 rounded-2xl py-4 px-4 text-white placeholder:text-neutral-600 focus:ring-0" placeholder="Primary Contact" type="tel"/>
</div>
<div class="flex gap-2">
<div class="w-24 shrink-0 bg-surface-dark border border-white/5 rounded-2xl flex items-center px-3">
<span class="text-xs font-bold text-text-secondary mr-1">🇮🇳</span>
<select class="bg-transparent border-none text-sm p-0 focus:ring-0 w-full">
<option>+91</option>
</select>
</div>
<input class="flex-1 bg-surface-dark border-white/5 rounded-2xl py-4 px-4 text-white placeholder:text-neutral-600 focus:ring-0" placeholder="Secondary Contact" type="tel"/>
</div>
<div class="flex gap-2">
<div class="w-24 shrink-0 bg-surface-dark border border-white/5 rounded-2xl flex items-center px-3">
<span class="text-xs font-bold text-text-secondary mr-1">🇮🇳</span>
<select class="bg-transparent border-none text-sm p-0 focus:ring-0 w-full">
<option>+91</option>
</select>
</div>
<input class="flex-1 bg-surface-dark border-white/5 rounded-2xl py-4 px-4 text-white placeholder:text-neutral-600 focus:ring-0" placeholder="Backup Contact" type="tel"/>
</div>
</div>
</div>
</div>
<div class="mt-12 mb-8">
<button class="w-full bg-primary text-background-dark py-5 rounded-2xl text-lg font-bold flex items-center justify-center gap-2 active:scale-[0.98] transition-all shadow-[0_10px_30px_rgba(255,197,0,0.2)]">
            Next Step
            <span class="material-symbols-outlined">arrow_forward</span>
</button>
<p class="text-center text-text-secondary text-[10px] uppercase tracking-widest mt-6">Secure Registration via Eventology Node</p>
</div>

</body></html>
